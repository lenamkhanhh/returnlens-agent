services:
  - type: web
    name: returnlens-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.10.0
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_PRIMARY
        value: gemini-3.5-flash-lite
      - key: MODEL_FALLBACK
        value: gemini-3.6-flash
      - key: DATA_DIR
        value: ./data
      - key: OPERATOR_PASSWORD
        sync: false
      - key: DEMO_SNAPSHOT
        value: app/demo/snapshot/demo_cold_open.db
      - key: DEMO_TODAY
        value: "2026-11-11"
      - key: HARNESS_MODE
        value: "0"
