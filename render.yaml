services:
  - type: web
    name: returnlens-demo
    runtime: python
    buildCommand: "npm --prefix app/web install && npm --prefix app/web run build && pip install ."
    startCommand: "uvicorn app.backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.10.0
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_PRIMARY
        value: gemini-3.6-flash
      - key: SELLER_DEMO_PASSWORD
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      - key: DEMO_SNAPSHOT
        value: app/demo/snapshot/demo_cold_open.db
      - key: DEMO_TODAY
        value: "2026-11-11"
      - key: HARNESS_MODE
        value: "0"
